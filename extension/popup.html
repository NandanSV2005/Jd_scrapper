<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Scraper Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8faff;
      color: #1F4E79;
    }
    .container { padding: 16px; }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #1F4E79, #4A90D9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .icon { font-size: 24px; }

    .info-box {
      background: #eef4fb;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #333;
      margin-bottom: 16px;
      border-left: 3px solid #4A90D9;
    }
    .info-box strong { color: #1F4E79; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #1F4E79, #4A90D9);
      color: white;
      margin-bottom: 8px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(31,78,121,0.3); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      background: white;
      color: #1F4E79;
      border: 1px solid #d0d8e8;
    }
    .btn-secondary:hover { background: #f0f4fa; }

    .status {
      margin: 12px 0;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .status.loading {
      display: block;
      background: #FFF8E1;
      color: #795500;
      border: 1px solid #FFE082;
    }
    .status.success {
      display: block;
      background: #E8F5E9;
      color: #1B5E20;
      border: 1px solid #A5D6A7;
    }
    .status.error {
      display: block;
      background: #FFEBEE;
      color: #B71C1C;
      border: 1px solid #EF9A9A;
    }

    .result-count {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: #1F4E79;
      margin: 8px 0;
    }
    .result-label {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    .options {
      margin: 12px 0;
      padding: 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e0e8f0;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #333;
      margin-bottom: 6px;
    }
    .options input[type="checkbox"] { accent-color: #4A90D9; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d8e8;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
      color: #333;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #4A90D9;
      box-shadow: 0 0 0 2px rgba(74,144,217,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="icon">💼</span>
      <h1>Job Scraper Pro</h1>
    </div>

    <div class="info-box" id="pageInfo">
      <strong>Current page:</strong><br>
      <span id="pageUrl">Loading...</span>
    </div>

    <div class="options">
      <label>
        <input type="checkbox" id="dedupCheck" checked>
        Enable Deduplication
      </label>
      <label>
        <input type="checkbox" id="deepMode" checked>
        Deep Mode (scan entire page DOM)
      </label>
      <label>
        <input type="checkbox" id="autoDownload" checked>
        Auto-download Excel when done
      </label>
    </div>

    <div class="options" id="selectorOptions" style="display:none;">
      <label style="font-weight:600;margin-bottom:8px;">🎯 Custom CSS Selectors (optional)</label>
      <input type="text" id="cssCompany" placeholder="Company selector e.g. .company-name">
      <input type="text" id="cssRole" placeholder="Job role selector e.g. .job-title">
      <input type="text" id="cssDesc" placeholder="Description selector e.g. .description">
    </div>

    <button class="btn btn-primary" id="scrapeBtn">
      🔍 Scrape This Page
    </button>
    <button class="btn btn-secondary" id="toggleSelectors" style="font-size:12px;padding:6px;">
      🎯 Show Custom CSS Selectors
    </button>

    <div id="statusArea" class="status"></div>
    <div id="resultsArea" style="display:none;">
      <div class="result-count" id="resultCount">0</div>
      <div class="result-label">entries found on this page</div>
      <button class="btn btn-primary" id="downloadBtn">
        📥 Download Excel
      </button>
    </div>

    <div class="footer">
      Extracts company names & job info from any page
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
